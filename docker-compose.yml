services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  dashboard:
    build: .
    command: ["streamlit", "run", "apps/dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      AEGISPULSE_API: http://api:8000
    ports: ["8501:8501"]
    depends_on:
      api:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    depends_on: [api]
